<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>NEXUS Mockup</title>
<!--
  Stage 1 layout mockup for a Galaxy S22 (360 x 780 dp = 1080 x 2340 px).
  All numbers are placeholders ("—"). The chart lines are illustrative
  shapes, NOT market data.
-->
<style>
  :root {
    --bg: #F5F1E8;
    --text: #252525;
    --accent: #E88A42;
    --secondary: #75B9D5;
    --pos: #39845B;
    --neg: #DC665D;
    --muted: #8A8478;
    --rule: #D9D2C3;
    /* chart series */
    --s-iwm: #E88A42;
    --s-spy: #252525;
    --s-qqq: #75B9D5;
    --s-soxl: #8C6BB1;
    --s-spcx: #A89060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    width: 360px; height: 780px; overflow: hidden; position: relative;
    font-family: Inter, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .page { position: absolute; left: 20px; right: 20px; top: 0; }
  .label {
    font-size: 9.5px; font-weight: 600; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--muted);
  }
  .rule { height: 1px; background: var(--rule); }
  .rule.heavy { height: 2px; background: var(--text); }

  /* 1. clock */
  .clock { position: absolute; top: 44px; left: 0; right: 0; }
  .masthead { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; }
  .masthead .brand { font-weight: 800; font-size: 11px; letter-spacing: 3px; }
  .masthead .brand b { color: var(--accent); }
  .time {
    font-family: "Inter Display", Inter, sans-serif; font-weight: 300;
    font-size: 80px; line-height: 1; letter-spacing: -3px; margin-top: 8px;
  }
  .time small { font-size: 22px; letter-spacing: 0; font-weight: 500; margin-left: 6px; color: var(--muted); }
  .day { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .date { font-size: 14px; color: var(--muted); margin-top: 2px; }

  /* 2. weather */
  .weather { position: absolute; top: 226px; left: 0; right: 0; }
  .wx { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 10px; }
  .wx > div { text-align: center; border-left: 1px solid var(--rule); padding: 0 2px; }
  .wx > div:first-child { border-left: 0; }
  .wx .d { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
  .wx .dt { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .wx svg { width: 24px; height: 24px; margin: 4px 0 2px; }
  .wx .hi { font-size: 15px; font-weight: 700; }
  .wx .lo { font-size: 12px; color: var(--muted); }
  .wx .rain { font-size: 10px; color: var(--secondary); font-weight: 600; margin-top: 2px; }

  /* 3. watchlist */
  .stocks { position: absolute; top: 374px; left: 0; right: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th { font-size: 9px; font-weight: 600; letter-spacing: 1.2px; color: var(--muted);
       text-transform: uppercase; text-align: right; padding: 4px 0; }
  th:first-child, td:first-child { text-align: left; }
  td { font-size: 13px; padding: 4px 0; text-align: right; border-top: 1px solid var(--rule);
       font-variant-numeric: tabular-nums; }
  td.sym { font-weight: 700; letter-spacing: .5px; }
  td.sym i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .up { color: var(--pos); font-weight: 600; }
  .down { color: var(--neg); font-weight: 600; }

  /* 4. chart */
  .chart { position: absolute; top: 560px; left: 0; right: 0; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; }
  .chart svg { display: block; margin-top: 4px; }
  .legend { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; font-weight: 700; letter-spacing: .5px; }
  .legend span i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 4px; vertical-align: 2px; }
  .foot { display: flex; justify-content: space-between; margin-top: 6px; font-size: 9.5px; color: var(--muted); }
  .foot .live { color: var(--pos); font-weight: 600; }

  .stamp {
    position: absolute; right: 2px; top: 30px; font-size: 8px; letter-spacing: 1.5px;
    font-weight: 700; color: var(--muted); opacity: .7;
  }
</style>
</head>
<body>
<div class="page">

  <!-- SECTION 1: CLOCK -->
  <section class="clock">
    <div class="masthead">
      <span class="brand">NEXUS<b>.</b></span>
      <span class="label">Markets &amp; Weather</span>
    </div>
    <div class="rule heavy"></div>
    <div class="time">10:24<small>AM</small></div>
    <div class="day">Sunday</div>
    <div class="date">8 November 2026</div>
  </section>

  <!-- SECTION 2: WEATHER -->
  <section class="weather">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="label">5-Day Forecast</span>
      <span class="label">Rain %</span>
    </div>
    <div class="rule" style="margin-top:6px"></div>
    <div class="wx" id="wx"></div>
  </section>

  <!-- SECTION 3: WATCHLIST -->
  <section class="stocks">
    <div class="label">Watchlist</div>
    <table>
      <thead><tr><th>Symbol</th><th>Price</th><th>Chg $</th><th>Chg %</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <!-- SECTION 4: CHART -->
  <section class="chart">
    <div class="chart-head">
      <span class="label">5-Day Performance</span>
      <span class="label">% from start</span>
    </div>
    <svg id="chart" width="320" height="104" viewBox="0 0 320 104"></svg>
    <div class="legend" id="legend"></div>
    <div class="foot"><span>Updated --:--</span><span class="live">● Live</span></div>
    <div class="stamp">ILLUSTRATIVE</div>
  </section>

</div>

<script>
  // ---- weather (placeholders only) ----
  const icons = {
    sun: '<svg viewBox="0 0 26 26" fill="none" stroke="#E88A42" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="13" r="5"/><path d="M13 2v3M13 21v3M2 13h3M21 13h3M5.2 5.2l2.1 2.1M18.7 18.7l2.1 2.1M5.2 20.8l2.1-2.1M18.7 7.3l2.1-2.1"/></svg>',
    cloud: '<svg viewBox="0 0 26 26" fill="none" stroke="#252525" stroke-width="2" stroke-linejoin="round"><path d="M7.5 19h11a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7.5 19z"/></svg>',
    part: '<svg viewBox="0 0 26 26" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.5" stroke="#E88A42"/><path d="M9 2v1.5M2 9h1.5M4 4l1 1M14 4l-1 1" stroke="#E88A42"/><path d="M9 21h10a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1.2A2.9 2.9 0 0 0 9 21z" stroke="#252525" fill="#F5F1E8"/></svg>',
    rain: '<svg viewBox="0 0 26 26" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 16h11a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7.5 16z" stroke="#252525"/><path d="M9 19l-1 3M13 19l-1 3M17 19l-1 3" stroke="#75B9D5"/></svg>'
  };
  const days = [['Sun','8 Nov','sun'],['Mon','9 Nov','part'],['Tue','10 Nov','rain'],['Wed','11 Nov','cloud'],['Thu','12 Nov','sun']];
  document.getElementById('wx').innerHTML = days.map(([d,dt,ic]) =>
    `<div><div class="d">${d}</div><div class="dt">${dt}</div>${icons[ic]}
     <div class="hi">--°</div><div class="lo">--°</div><div class="rain">--%</div></div>`).join('');

  // ---- watchlist (placeholders only; colours show the up/down rule) ----
  const series = [['IWM','--s-iwm',1],['SPY','--s-spy',1],['QQQ','--s-qqq',1],['SOXL','--s-soxl',-1],['SPCX','--s-spcx',-1]];
  document.getElementById('rows').innerHTML = series.map(([s,c,dir]) => {
    const cls = dir > 0 ? 'up' : 'down', sign = dir > 0 ? '▲ +' : '▼ −';
    return `<tr><td class="sym"><i style="background:var(${c})"></i>${s}</td><td>--.--</td>
            <td class="${cls}">${sign}--.--</td><td class="${cls}">${dir>0?'+':'−'}-.--%</td></tr>`;
  }).join('');

  // ---- chart (ILLUSTRATIVE shapes, not data) ----
  const W = 320, H = 92, left = 26, css = getComputedStyle(document.documentElement);
  let svg = '';
  const ys = [{v:'+2%',y:10},{v:'0%',y:46},{v:'−2%',y:82}];
  ys.forEach(g => {
    svg += `<line x1="${left}" x2="${W}" y1="${g.y}" y2="${g.y}" stroke="#D9D2C3" stroke-width="1" ${g.v==='0%'?'':'stroke-dasharray="2 3"'}/>`;
    svg += `<text x="0" y="${g.y+3}" font-size="8.5" fill="#8A8478" font-family="Inter">${g.v}</text>`;
  });
  ['Mon','Tue','Wed','Thu','Fri'].forEach((d,i) => {
    const x = left + (W-left) * (i + .5) / 5;
    svg += `<text x="${x}" y="102" font-size="8.5" fill="#8A8478" text-anchor="middle" font-family="Inter">${d}</text>`;
  });
  series.forEach(([s,c], k) => {
    const pts = [];
    for (let i = 0; i <= 34; i++) {
      const t = i / 34;
      const y = 46 - (Math.sin(t * (2 + k * .7) + k) * (8 + k * 3) + (k - 2) * 7 * t);
      pts.push(`${(left + (W-left) * t).toFixed(1)},${y.toFixed(1)}`);
    }
    svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${css.getPropertyValue(c).trim()}" stroke-width="${k===1?1.6:2}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  document.getElementById('chart').innerHTML = svg;
  document.getElementById('legend').innerHTML = series.map(([s,c]) =>
    `<span><i style="background:var(${c})"></i>${s}</span>`).join('');
</script>
</body>
</html>
